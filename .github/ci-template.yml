name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: uv sync --project app/backend --locked --extra dev
      - run: app/backend/.venv/bin/python -m pytest app/backend/tests -q
      - run: npm --prefix app/frontend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix app/frontend test
      - run: npm --prefix app/frontend run build
      - run: app/backend/.venv/bin/python scripts/verify_local_flow.py
