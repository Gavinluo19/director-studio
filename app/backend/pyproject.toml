[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "director-studio"
version = "1.2.0a1"
description = "Local, budget-controlled multi-model video production studio"
license = "MIT"
authors = [{name = "Gavin Luo"}]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "pydantic>=2.11,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "pillow>=11,<13",
  "cryptography>=44", "keyring>=25,<27", "langgraph>=1,<2", "langgraph-checkpoint-sqlite", "openai-codex"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "numpy>=2,<3"]
transcription = ["mlx-whisper==0.4.3"]

[project.scripts]
director-studio = "studio.launcher:main"

[project.urls]
Homepage = "https://github.com/Gavinluo19/director-studio"
Issues = "https://github.com/Gavinluo19/director-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
